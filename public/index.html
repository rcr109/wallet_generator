<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Gerador de Carteira Bitcoin (Testnet)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1rem;
      background: #f4f5f7;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .field {
      margin-bottom: 0.8rem;
    }
    .field label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.25rem;
    }
    .field textarea,
    .field input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.4rem 0.5rem;
      border-radius: 4px;
      border: 1px solid #d1d5db;
      font-family: monospace;
      font-size: 0.9rem;
      background: #f9fafb;
    }
    .field textarea {
      min-height: 70px;
      resize: vertical;
    }
    .meta {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 1rem;
    }
    .row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .row button {
      flex: 1;
      min-width: 120px;
    }
    .alert {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #059669;
    }
    .alert-error {
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <h1>Gerador de Carteira Bitcoin (Testnet)</h1>

  <div class="card">
    <p class="meta">
      Esta ferramenta gera uma carteira Bitcoin em <strong>testnet</strong> para fins de estudo.
      Não use este gerador para armazenar valores reais.
    </p>
    <button id="btnGenerate" class="btn btn-primary">
      Gerar nova carteira
    </button>
    <div id="status" class="alert" style="display: none;"></div>
  </div>

  <div class="card">
    <div class="field">
      <label>Rede</label>
      <input type="text" id="network" readonly />
    </div>
    <div class="field">
      <label>Path (derivação)</label>
      <input type="text" id="path" readonly />
    </div>
    <div class="field">
      <label>Endereço BTC</label>
      <textarea id="address" readonly></textarea>
    </div>
    <div class="field">
      <label>Chave Privada (WIF)</label>
      <textarea id="wif" readonly></textarea>
    </div>
    <div class="field">
      <label>Mnemonic (seed phrase)</label>
      <textarea id="mnemonic" readonly></textarea>
    </div>
    <div class="row">
      <button class="btn" type="button" onclick="copyField('address')">Copiar endereço</button>
      <button class="btn" type="button" onclick="copyField('wif')">Copiar WIF</button>
      <button class="btn" type="button" onclick="copyField('mnemonic')">Copiar mnemonic</button>
    </div>
    <div id="copyStatus" class="alert" style="display: none;"></div>
  </div>

  <script>
    const btnGenerate = document.getElementById('btnGenerate');
    const statusEl = document.getElementById('status');
    const copyStatusEl = document.getElementById('copyStatus');

    async function generateWallet() {
      statusEl.style.display = 'block';
      statusEl.classList.remove('alert-error');
      statusEl.textContent = 'Gerando carteira...';
      btnGenerate.disabled = true;

      clearCopyStatus();

      try {
        const response = await fetch('/api/create-wallet');
        if (!response.ok) {
          throw new Error('Resposta inválida da API');
        }

        const data = await response.json();

        document.getElementById('network').value = data.network || '';
        document.getElementById('path').value = data.path || '';
        document.getElementById('address').value = data.address || '';
        document.getElementById('wif').value = data.wif || '';
        document.getElementById('mnemonic').value = data.mnemonic || '';

        statusEl.textContent = 'Carteira gerada com sucesso.';
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Erro ao gerar carteira.';
        statusEl.classList.add('alert-error');
      } finally {
        btnGenerate.disabled = false;
      }
    }

    function clearCopyStatus() {
      copyStatusEl.style.display = 'none';
      copyStatusEl.textContent = '';
    }

    async function copyField(fieldId) {
      clearCopyStatus();
      const value = document.getElementById(fieldId).value;
      if (!value) return;

      try {
        await navigator.clipboard.writeText(value);
        copyStatusEl.style.display = 'block';
        copyStatusEl.textContent = 'Copiado para a área de transferência.';
      } catch (err) {
        console.error(err);
        copyStatusEl.style.display = 'block';
        copyStatusEl.classList.add('alert-error');
        copyStatusEl.textContent = 'Não foi possível copiar.';
      }
    }

    btnGenerate.addEventListener('click', generateWallet);

    // opcional: gerar uma carteira automaticamente ao abrir a página
    // generateWallet();
  </script>
</body>
</html>
